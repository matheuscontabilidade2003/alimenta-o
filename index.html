<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090a0a">
  <meta name="description" content="Alimenta-o — alimentação, compras, movimento e rotina em uma única experiência.">
  <title>Alimenta-o</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body data-view="today">
  <a class="skip-link" href="#app-view">Ir para o conteúdo</a>

  <header class="site-header">
    <a class="brand" href="#today" data-route="today" aria-label="Alimenta-o — Hoje">
      <span class="brand-symbol" aria-hidden="true"><i></i><i></i></span>
      <span class="brand-name">ALIMENTA<span>•O</span></span>
    </a>
    <div class="header-context" aria-label="Contexto do aplicativo">
      <span>ROTINA PESSOAL</span>
      <time id="current-date"></time>
    </div>
    <div class="system-state"><i aria-hidden="true"></i> BASE / 01</div>
  </header>

  <main id="app-view" tabindex="-1"></main>

  <nav class="motion-nav" aria-label="Áreas do Alimenta-o">
    <div class="motion-nav__shell">
      <div class="motion-nav__meta" aria-hidden="true">
        <span>ÁREAS</span>
        <b>07</b>
      </div>
      <div class="motion-nav__viewport" id="nav-viewport">
        <div class="motion-nav__track" id="nav-track">
          <div class="motion-nav__group" id="nav-primary">
            <button class="motion-nav__item" data-route="today">HOJE</button>
            <button class="motion-nav__item" data-route="offers">OFERTAS</button>
            <button class="motion-nav__item" data-route="shopping">COMPRAS</button>
            <button class="motion-nav__item" data-route="food">ALIMENTAÇÃO</button>
            <button class="motion-nav__item" data-route="movement">MOVIMENTO</button>
            <button class="motion-nav__item" data-route="routes">TRAJETOS</button>
            <button class="motion-nav__item" data-route="progress">PROGRESSO</button>
          </div>
          <div class="motion-nav__group motion-nav__group--mirror" aria-hidden="true">
            <button class="motion-nav__mirror-item" data-mirror="today" data-route="today" tabindex="-1">HOJE</button>
            <button class="motion-nav__mirror-item" data-mirror="offers" data-route="offers" tabindex="-1">OFERTAS</button>
            <button class="motion-nav__mirror-item" data-mirror="shopping" data-route="shopping" tabindex="-1">COMPRAS</button>
            <button class="motion-nav__mirror-item" data-mirror="food" data-route="food" tabindex="-1">ALIMENTAÇÃO</button>
            <button class="motion-nav__mirror-item" data-mirror="movement" data-route="movement" tabindex="-1">MOVIMENTO</button>
            <button class="motion-nav__mirror-item" data-mirror="routes" data-route="routes" tabindex="-1">TRAJETOS</button>
            <button class="motion-nav__mirror-item" data-mirror="progress" data-route="progress" tabindex="-1">PROGRESSO</button>
          </div>
        </div>
      </div>
      <div class="motion-nav__hint" aria-hidden="true">NAVEGAR ↗</div>
    </div>
  </nav>

  <div class="route-announcer" id="route-announcer" aria-live="polite" aria-atomic="true"></div>
  <noscript>O Alimenta-o precisa de JavaScript habilitado para alternar entre as áreas.</noscript>
  <script src="./app.js" defer></script>
</body>
</html>
